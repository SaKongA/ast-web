<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>科研成果详情 - 亚洲科学技术研究院</title>
  <link rel="icon" href="/images/logo.png" type="image/png">
  <link href="/lib/fonts/google-fonts.css" rel="stylesheet">
  <link rel="stylesheet" href="/lib/fontawesome/css/all.min.css">
  <link rel="stylesheet" href="/styles/global.css">
  <link rel="stylesheet" href="/styles/research-detail.css">
  <!-- 添加代码高亮样式 -->
  <link rel="stylesheet" href="/lib/highlight/atom-one-dark.min.css">
  <style>
    /* 关键字标签样式 */
    .keywords-section {
      margin: 30px 0;
      padding-top: 20px;
      border-top: 1px dashed rgba(255, 255, 255, 0.1);
    }
    
    .keywords-container {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }
    
    .keywords-label {
      font-size: 1rem;
      color: var(--text-secondary);
      margin-right: 15px;
      display: flex;
      align-items: center;
    }
    
    .keyword-tag {
      display: inline-flex;
      align-items: center;
      padding: 6px 14px;
      background-color: rgba(30, 136, 229, 0.15);
      border: 1px solid rgba(30, 136, 229, 0.3);
      border-radius: 20px;
      color: var(--primary-color);
      font-size: 0.9rem;
      font-weight: 500;
      transition: all 0.2s ease;
      height: 32px;
    }
    
    .keyword-tag:hover {
      background-color: rgba(30, 136, 229, 0.25);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <!-- 导航栏 -->
  <div id="navbar-container"></div>
  
  <!-- 页面头部 -->
  <header class="page-header">
    <div class="container">
      <h1 class="page-title">科研成果详情</h1>
    </div>
  </header>
  
  <!-- 科研成果详情内容 -->
  <section class="research-detail">
    <div class="container">
      <div id="research-container">
        <div class="loading">
          <div class="loading-spinner"></div>
          <p class="loading-text">加载科研成果详情...</p>
        </div>
      </div>
    </div>
  </section>
  
  <!-- 页脚 -->
  <div id="footer-container"></div>
  
  <!-- 脚本 -->
  <script src="/components/Navbar.js"></script>
  <script src="/components/Footer.js"></script>
  <script src="/components/Api.js"></script>
  <script src="/components/Markdown.js"></script>
  <!-- marked库 -->
  <!-- 代码高亮库 -->
  <script src="/lib/highlight/core.min.js"></script>
  <script src="/lib/highlight/javascript.min.js"></script>
  <script src="/lib/highlight/javascript.min.js"></script>
  <script src="/js/research-detail.js"></script>
</body>
</html>
