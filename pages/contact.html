<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>联系我们 - 亚洲科学技术研究院</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
  <link rel="stylesheet" href="/styles/global.css">
  <link rel="stylesheet" href="/styles/contact.css">
</head>
<body class="contact-page">
  <!-- 导航栏 -->
  <div id="navbar-container"></div>
  
  <!-- 页面头部 -->
  <header class="page-header">
    <div class="header-bg-container">
      <div class="header-bg-image"></div>
      <div class="header-bg-gradient"></div>
    </div>
    <div class="container">
      <h1 class="page-title">联系我们</h1>
      <p class="page-description">欢迎与亚洲科学技术研究院联系，我们期待您的咨询与合作</p>
    </div>
  </header>
  
  <!-- 联系信息 -->
  <section class="contact-section">
    <div class="container">
      <div class="loading-placeholder">
        <i class="fas fa-spinner fa-spin"></i>
        <p>正在加载联系信息...</p>
      </div>
    </div>
  </section>
  
  <!-- 地图部分 -->
  <section class="map-section">
    <div class="container">
      <h2 class="info-title bold-title">我们的位置</h2>
      <div class="map-container" id="contact-map">
        <!-- 地图将通过JavaScript动态加载 -->
      </div>
      <div class="map-actions">
        <a href="https://maps.google.com/?q=Singapore+General+Hospital" target="_blank" class="map-action-btn">
          <i class="fas fa-directions"></i> 获取路线
        </a>
        <a href="tel:+6586568589" class="map-action-btn">
          <i class="fas fa-phone"></i> 联系我们
        </a>
      </div>
    </div>
  </section>
  
  <!-- 页脚 -->
  <div id="footer-container"></div>
  
  <!-- 脚本 -->
  <script src="/components/Navbar.js"></script>
  <script src="/components/Footer.js"></script>
  <script src="/components/Api.js"></script>
  <script src="/js/contact.js"></script>
</body>
</html>
